<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venue Listing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: #fff;
      padding: 15px;
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      margin: 0 0 10px;
    }

    .location {
      color: #777;
      font-size: 14px;
    }

    .price {
      margin-top: 10px;
      font-weight: bold;
      color: #27ae60;
    }
  </style>
</head>
<body>

<header>
  <h1>Venue Listings</h1>
</header>

<div class="container" id="venueContainer"></div>

<script>
  const venues = [
    {
      name: "Royal Palace Hall",
      image: "https://images.unsplash.com/photo-1505691723518-36a5ac3be353",
      location: "Bhopal",
      price: "₹50,000/day"
    },
    {
      name: "Green Garden Lawn",
      image: "https://images.unsplash.com/photo-1464366400600-7168b8af9bc3",
      location: "Indore",
      price: "₹30,000/day"
    },
    {
      name: "Sunset Banquet",
      image: "https://images.unsplash.com/photo-1519167758481-83f550bb49b3",
      location: "Delhi",
      price: "₹70,000/day"
    },
    {
  name: "Lake View Resort",
  image: "https://picsum.photos/800/600?random=4",
  location: "Udaipur",
  price: "₹90,000/day"
},
    {
      name: "City Convention Center",
      image: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30",
      location: "Mumbai",
      price: "₹1,20,000/day"
    }
  ];

  const container = document.getElementById("venueContainer");

  venues.forEach(venue => {
    const card = document.createElement("div");
    card.classList.add("card");

    card.innerHTML = `
      <img src="${venue.image}" alt="${venue.name}">
      <div class="card-content">
        <h3>${venue.name}</h3>
        <p class="location">📍 ${venue.location}</p>
        <p class="price">${venue.price}</p>
      </div>
    `;

    container.appendChild(card);
  });
</script>

</body>
</html>
